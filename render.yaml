services:
  - type: web
    name: crown-arcade
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        value: https://crown-arcade.onrender.com
      - key: DATA_DIR
        value: /tmp/crown-data   # free tier: wiped on every restart. Add a disk and point this at it to keep accounts.
      - key: GOOGLE_CLIENT_ID
        sync: false
